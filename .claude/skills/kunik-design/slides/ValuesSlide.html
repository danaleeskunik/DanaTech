<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}html,body{width:1280px;height:720px;overflow:hidden}body{font-family:var(--font-ui);color:var(--ink-1);background:var(--surface-canvas)}.slide{width:1280px;height:720px;display:flex;flex-direction:column;position:relative;overflow:hidden}.navy{background:var(--hero-gradient);color:#fff}.dots{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(#fff 1.2px,transparent 1.2px);background-size:26px 26px}.pad{position:relative;padding:64px 80px;flex:1;display:flex;flex-direction:column}.mark{display:flex;align-items:flex-end;gap:5px;height:34px}.mark i{width:11px;border-radius:3px;display:block}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2.4px;color:var(--blue-300)}.eyebrow.d{color:var(--blue-500)}.h1{font-size:66px;font-weight:800;letter-spacing:-2px;line-height:1.05}.h2{font-size:46px;font-weight:800;letter-spacing:-1.2px;color:var(--navy-800)}.foot{position:absolute;bottom:34px;right:80px;left:80px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:var(--ink-7)}</style></head><body><div class="slide"><div class="pad" style="justify-content:center;align-items:center;text-align:center">
<div class="h2" style="font-size:72px;letter-spacing:-2.4px">בגובה העיניים</div>
<div style="font-size:26px;font-weight:500;color:var(--ink-6);margin-top:20px">בלי ז'רגון. בלי למהר. איפה שאתם נמצאים.</div>
<div style="display:flex;gap:64px;margin-top:72px">
<div style="font-size:38px;font-weight:800;color:var(--navy-800)">סבלנות</div><div style="width:2px;background:var(--border-rule)"></div><div style="font-size:38px;font-weight:800;color:var(--navy-800)">כבוד</div><div style="width:2px;background:var(--border-rule)"></div><div style="font-size:38px;font-weight:800;color:var(--navy-800)">הקשבה</div>
</div></div>
<div class="foot"><span>דנה קוניק · טק בגובה העיניים</span><div class="mark"><i style="height:16px;background:var(--blue-300)"></i><i style="height:25px;background:var(--blue-400)"></i><i style="height:34px;background:var(--navy-800)"></i></div></div></div></body></html>
