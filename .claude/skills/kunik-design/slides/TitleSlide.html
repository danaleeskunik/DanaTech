<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">

<style>*{box-sizing:border-box;margin:0}html,body{width:1280px;height:720px;overflow:hidden}body{font-family:var(--font-ui);color:var(--ink-1);background:var(--surface-canvas)}.slide{width:1280px;height:720px;display:flex;flex-direction:column;position:relative;overflow:hidden}.navy{background:var(--hero-gradient);color:#fff}.dots{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(#fff 1.2px,transparent 1.2px);background-size:26px 26px}.pad{position:relative;padding:64px 80px;flex:1;display:flex;flex-direction:column}.mark{display:flex;align-items:flex-end;gap:5px;height:34px}.mark i{width:11px;border-radius:3px;display:block}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2.4px;color:var(--blue-300)}.eyebrow.d{color:var(--blue-500)}.h1{font-size:66px;font-weight:800;letter-spacing:-2px;line-height:1.05}.h2{font-size:46px;font-weight:800;letter-spacing:-1.2px;color:var(--navy-800)}.foot{position:absolute;bottom:34px;right:80px;left:80px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:var(--ink-7)}</style></head><body><div class="slide navy"><div class="dots"></div><div class="pad" style="justify-content:center">

<div><div class="mark"><i style="height:16px;background:var(--blue-300)"></i><i style="height:25px;background:var(--blue-400)"></i><i style="height:34px;background:#fff"></i></div>

<div style="font-size:30px;font-weight:600;color:var(--blue-120);margin-top:14px">שיעורי טכנולוגיה בבית שלכם</div>
<div class="eyebrow" style="margin-top:26px">דנה קוניק</div></div></div></div></div></body></html>
