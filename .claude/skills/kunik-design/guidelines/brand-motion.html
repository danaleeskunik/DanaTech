<!-- @dsCard group="Brand" viewport="700x170" name="Motion & states" subtitle="One 150ms lift. Hover on cards, colour on buttons, nothing else." -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><style>.demo{background:#fff;border:1px solid var(--border-card);border-radius:var(--radius-14);box-shadow:var(--shadow-card);padding:16px;flex:1;font-size:13px;font-weight:700;transition:transform 150ms ease,box-shadow 150ms ease}.demo:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}.btn{padding:12px 22px;border-radius:999px;background:var(--blue-500);color:#fff;font-weight:800;font-size:14px;border:none;cursor:pointer;transition:background 150ms ease}.btn:hover{background:var(--blue-600)}.btn:active{background:var(--blue-700)}</style>
<div class="row" style="gap:14px;background:var(--surface-canvas);padding:14px;border-radius:var(--radius-12)">
<div class="demo">קלף — ריחוף מרים ב-3px</div>
<button class="btn">כפתור — ריחוף מכהה</button>
<div style="font-size:12px;font-weight:600;color:var(--ink-6);flex:1;line-height:1.6">ללא bounce, ללא slide-in, ללא skeletons. מצב לחיצה = גוון כהה יותר, לא הקטנה.</div></div></body></html>
