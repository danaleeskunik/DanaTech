<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="grid"><div class="pair"><div class="top" style="background:var(--domain-insurance-bg)"></div><div class="bot" style="background:var(--domain-insurance);color:#fff">ביטוחים</div></div><div class="pair"><div class="top" style="background:var(--domain-savings-bg)"></div><div class="bot" style="background:var(--domain-savings);color:#fff">חסכונות</div></div><div class="pair"><div class="top" style="background:var(--domain-health-bg)"></div><div class="bot" style="background:var(--domain-health);color:#fff">בריאות</div></div><div class="pair"><div class="top" style="background:var(--domain-vehicles-bg)"></div><div class="bot" style="background:var(--domain-vehicles);color:#fff">רכבים</div></div><div class="pair"><div class="top" style="background:var(--domain-documents-bg)"></div><div class="bot" style="background:var(--domain-documents);color:#fff">מסמכים</div></div><div class="pair"><div class="top" style="background:var(--domain-payments-bg)"></div><div class="bot" style="background:var(--domain-payments);color:#fff">תשלומים</div></div><div class="pair"><div class="top" style="background:var(--domain-income-bg)"></div><div class="bot" style="background:var(--domain-income);color:#fff">הכנסות</div></div></div></body></html>
