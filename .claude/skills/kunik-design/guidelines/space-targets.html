<!-- @dsCard group="Spacing" viewport="700x160" name="Accessibility floors" subtitle="44px taps, 46px fields, 16px task text — non-negotiable" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="row" style="gap:16px">
<div style="text-align:center"><div style="width:30px;height:30px;border:1.5px solid var(--border-field);border-radius:8px;background:var(--surface-sunken)"></div><div style="font-size:10px;color:var(--ink-7);margin-top:6px">30 — tables only</div></div>
<div style="text-align:center"><div style="width:44px;height:44px;border:1.5px solid var(--border-field);border-radius:10px;background:#fff"></div><div style="font-size:10px;color:var(--ink-7);margin-top:6px">44 — every tap</div></div>
<div style="text-align:center"><div style="width:52px;height:52px;border-radius:50%;background:var(--navy-800);box-shadow:var(--shadow-fab)"></div><div style="font-size:10px;color:var(--ink-7);margin-top:6px">52 — home pill</div></div>
<div style="flex:1"><div style="height:46px;border:2px solid var(--border-field);border-radius:10px;background:var(--surface-sunken);display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink-7)">46px · טקסט 16px</div></div></div></body></html>
