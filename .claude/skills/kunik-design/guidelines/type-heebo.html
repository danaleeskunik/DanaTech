<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="row" style="gap:26px;font-family:var(--font-num)">
<div><div class="cap">STAT · 900 · -1px</div><div style="font-size:38px;font-weight:900;letter-spacing:-1px;color:var(--navy-800)">₪3,450</div></div>
<div><div class="cap">PHONE · 900 · -1.4px</div><div dir="ltr" style="font-size:34px;font-weight:900;letter-spacing:-1.4px;color:var(--navy-800)">053-700-4934</div></div>
<div><div class="cap">TIME · 700</div><div style="font-size:26px;font-weight:700;color:var(--ink-6)">10:00</div></div>
<div><div class="cap">SHEET №</div><div style="width:40px;height:40px;border-radius:var(--radius-10);background:var(--blue-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800">7</div></div></div></body></html>
