<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="row" style="gap:24px">
<div style="background:var(--navy-800);padding:20px 26px;border-radius:var(--radius-14);display:flex;align-items:flex-end;gap:4px;height:74px"><div style="width:10px;height:16px;border-radius:3px;background:var(--blue-300)"></div><div style="width:10px;height:25px;border-radius:3px;background:var(--blue-400)"></div><div style="width:10px;height:34px;border-radius:3px;background:#fff"></div></div>
<div style="background:var(--surface-sunken);border:1px solid var(--border-card);padding:20px 26px;border-radius:var(--radius-14);display:flex;align-items:flex-end;gap:4px;height:74px"><div style="width:10px;height:16px;border-radius:3px;background:var(--blue-300)"></div><div style="width:10px;height:25px;border-radius:3px;background:var(--blue-400)"></div><div style="width:10px;height:34px;border-radius:3px;background:var(--navy-800)"></div></div>
<img src="../assets/logo.svg" width="74" height="74" alt="Kunik app icon">
<div style="font-size:12px;font-weight:600;color:var(--ink-6);line-height:1.6;max-width:210px">אין wordmark. שם המותג נכתב תמיד ב-Rubik 800 לצד הסימן.</div></div></body></html>
