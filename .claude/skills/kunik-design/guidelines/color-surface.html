<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces & borders" subtitle="Near-white canvas, white cards, four hairlines" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="grid"><div class="sw" style="background:var(--surface-canvas);color:#0F2E52"><b>F4F7FB</b><span>surface-canvas</span></div><div class="sw" style="background:var(--surface-card);color:#0F2E52"><b>FFFFFF</b><span>surface-card</span></div><div class="sw" style="background:var(--surface-sunken);color:#0F2E52"><b>F7F9FC</b><span>surface-sunken</span></div><div class="sw" style="background:var(--surface-muted);color:#0F2E52"><b>F2F5F9</b><span>surface-muted</span></div><div class="sw" style="background:var(--border-card);color:#0F2E52"><b>E4EAF1</b><span>border-card</span></div><div class="sw" style="background:var(--border-field);color:#0F2E52"><b>DFE2E4</b><span>border-field</span></div><div class="sw" style="background:var(--border-hair);color:#0F2E52"><b>F0F3F7</b><span>border-hair</span></div><div class="sw" style="background:var(--border-rule);color:#0F2E52"><b>DDE3EB</b><span>border-rule</span></div></div></body></html>
