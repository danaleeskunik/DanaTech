<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card);font-family:var(--font-ui);color:var(--ink-1);direction:rtl}.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;border-radius:var(--radius-10);padding:9px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;border:1px solid var(--border-card)}.sw b{font-size:11px;font-weight:800;letter-spacing:.2px}.sw span{font-size:10px;font-weight:600;opacity:.85;font-family:var(--font-num)}.pair{flex:1;min-width:92px;border-radius:var(--radius-10);overflow:hidden;border:1px solid var(--border-card)}.pair .top{height:44px}.pair .bot{padding:7px 9px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:10.5px;font-weight:700;color:var(--ink-7);letter-spacing:.5px;margin-bottom:8px}</style></head><body><div class="grid"><div class="sw" style="background:var(--ink-1);color:#fff"><b>121213</b><span>ink-1</span></div><div class="sw" style="background:var(--ink-2);color:#fff"><b>2A2D30</b><span>ink-2</span></div><div class="sw" style="background:var(--ink-4);color:#fff"><b>4A4D50</b><span>ink-4</span></div><div class="sw" style="background:var(--ink-5);color:#fff"><b>585B5E</b><span>ink-5</span></div><div class="sw" style="background:var(--ink-6);color:#fff"><b>6A6D70</b><span>ink-6</span></div><div class="sw" style="background:var(--ink-7);color:#fff"><b>8D9296</b><span>ink-7</span></div><div class="sw" style="background:var(--ink-8);color:#fff"><b>9AA0A6</b><span>ink-8</span></div><div class="sw" style="background:var(--ink-9);color:#121213"><b>A9B4BF</b><span>ink-9</span></div></div></body></html>
