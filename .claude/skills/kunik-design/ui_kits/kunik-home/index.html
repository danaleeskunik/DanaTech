<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><title>kunikHome — UI kit</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-canvas);color:var(--ink-1);font-family:var(--font-ui);direction:rtl}a{color:var(--link)}a:hover{color:var(--link-hover)}.lift{transition:var(--transition-card)}.lift:hover{transform:var(--hover-lift);box-shadow:var(--shadow-card-hover)}button,input,select,textarea{font-family:inherit}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="DomainView.jsx"></script>
<script type="text/babel" src="RecordForm.jsx"></script>
<script type="text/babel">
const { SidebarNav, Button, SyncStatus } = window.KunikDesignSystem_63ae72;
function App(){
  const [view,setView]=React.useState('home');
  const [form,setForm]=React.useState(null);
  const D=window.KH_DOMAINS;
  const items=[{id:'home',label:'סקירה כללית',icon:'home'},...D.map(d=>({id:d.key,label:d.label,icon:d.icon}))];
  const domain=D.find(d=>d.key===view);
  return (<div style={{display:'flex',minHeight:'100vh',width:'100%',background:'var(--surface-canvas)'}}>
    <SidebarNav title="kunikHome" subtitle="ביטוחים, כספים ובריאות במקום אחד" items={items} activeId={view} onSelect={setView}
      footer={<><Button variant="onNavy" shape="rounded" size="sm" icon="export" style={{justifyContent:'flex-start'}}>ייצוא גיבוי</Button><Button variant="onNavy" shape="rounded" size="sm" icon="import" style={{justifyContent:'flex-start'}}>ייבוא / שחזור</Button><SyncStatus state="synced" label="סונכרן 09:12" sub="Google Sheets" style={{border:'none',background:'transparent',padding:'9px 12px'}} /></>} />
    <main style={{flex:1,minWidth:0,padding:'40px 56px 60px',maxWidth:1160}}>
      {view==='home' ? <Overview go={setView} /> : <DomainView domain={domain} onAdd={()=>setForm(domain)} />}
    </main>
    {form && <RecordForm domain={form} onClose={()=>setForm(null)} />}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
