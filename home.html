<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טק בגובה העיניים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;700;800;900&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #F4F7FB;
    color: #121213;
    font-family: 'Rubik', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero {
    width: 100%;
    background: #0F2E52;
    color: #fff;
    padding: 40px 24px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .5;
  }
  .hero-inner { position: relative; }
  .logo-mark {
    display: inline-flex;
    align-items: flex-end;
    gap: 4px;
    height: 34px;
    margin-bottom: 18px;
  }
  .logo-mark div { width: 10px; border-radius: 3px; }
  .logo-mark div:nth-child(1) { height: 16px; background: #9CC7F5; }
  .logo-mark div:nth-child(2) { height: 25px; background: #3D9AFF; }
  .logo-mark div:nth-child(3) { height: 34px; background: #fff; }
  .hero h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 32px); font-weight: 800; }
  .hero p { margin: 0; font-size: 15px; font-weight: 500; color: #9CC7F5; letter-spacing: .3px; }

  main {
    width: 100%;
    max-width: 760px;
    padding: 0 20px;
    margin-top: -34px;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 560px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px;
    text-decoration: none;
    color: #121213;
    box-shadow: 0 8px 24px rgba(15,46,82,.10);
    border: 1px solid #E4EAF1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(15,46,82,.16);
  }
  .card-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .card.biz .card-icon { background: #EAF2FD; color: #0055B2; }
  .card.teach .card-icon { background: #EAF7F1; color: #00764A; }
  .card h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .card p { margin: 0; font-size: 14px; font-weight: 500; color: #6A6D70; line-height: 1.5; }
  .card .go {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
  }
  .card.biz .go { color: #0055B2; }
  .card.teach .go { color: #00764A; }
  .card .go svg { transform: scaleX(-1); }

  .secondary {
    margin-top: 26px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .secondary a {
    flex: 1 1 200px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #E4EAF1;
    border-radius: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: #121213;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(15,46,82,.06);
  }
  .secondary a .ic {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #F7F9FC;
    color: #585B5E;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  footer {
    margin: 40px 0 28px;
    font-size: 12.5px;
    font-weight: 500;
    color: #9AA0A6;
    text-align: center;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="logo-mark"><div></div><div></div><div></div></div>
    <h1>טק בגובה העיניים</h1>
    <p>דנה קוניק · שיעורי טכנולוגיה לגיל השלישי</p>
  </div>
</div>

<main>
  <div class="cards">
    <a class="card biz" href="index.html">
      <div class="card-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 19V9"/><path d="M12 19V5"/><path d="M17 19v-7"/></svg>
      </div>
      <h2>ניהול העסק</h2>
      <p>תלמידות, תשלומים, לוז שבועי, תזכורות וסיכומי שיעור — הכל במקום אחד.</p>
      <span class="go">כניסה
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
    <a class="card teach" href="teaching-toolkit.html">
      <div class="card-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <h2>ערכת ההוראה</h2>
      <p>מערכי שיעור לשלוש רמות — מוכנים להוראה מסודרת, שלב אחר שלב.</p>
      <span class="go">כניסה
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>

  <div class="secondary">
    <a href="practice-sheets.html">
      <span class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 19h16"/></svg>
      </span>
      גליונות תרגול להדפסה
    </a>
    <a href="flier.html">
      <span class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
      </span>
      הפלייר להדפסה ולשליחה
    </a>
  </div>
</main>

<footer>טק בגובה העיניים · דנה קוניק</footer>

</body>
</html>
